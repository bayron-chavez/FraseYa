[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraseya"
version = "0.1.0"
description = "Aplicación de escritorio FraseYa con persistencia SQLite"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fraseya.infraestructura" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["fraseya"]

[tool.coverage.report]
fail_under = 70
